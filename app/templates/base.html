<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}FamJam Posting UI{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark bg-dark px-4 py-2">
    <a class="navbar-brand fw-bold" href="/">
      <i class="bi bi-camera-reels me-2"></i>FamJam
    </a>
    <div class="d-flex align-items-center gap-3">
      <a class="nav-link text-secondary small" href="/">
        <i class="bi bi-images me-1"></i>Queue
      </a>
      <a class="nav-link text-secondary small" href="/setup">
        <i class="bi bi-gear me-1"></i>Setup
      </a>
      <button id="btn-restart" class="btn btn-outline-warning btn-sm py-0" onclick="restartServer()">
        <i class="bi bi-arrow-clockwise me-1"></i>Restart
      </button>
    </div>
  </nav>

  <div id="restart-banner" class="d-none text-center py-2 bg-warning text-dark fw-semibold small">
    <span class="spinner-border spinner-border-sm me-2"></span>Restarting server, please wait…
  </div>

  <script>
  async function restartServer() {
    const btn    = document.getElementById('btn-restart');
    const banner = document.getElementById('restart-banner');
    btn.disabled = true;
    banner.classList.remove('d-none');

    await fetch('/api/restart', { method: 'POST' }).catch(() => {});

    // Poll until server is back up
    const poll = setInterval(async () => {
      try {
        const r = await fetch('/');
        if (r.ok) {
          clearInterval(poll);
          location.reload();
        }
      } catch (_) {}
    }, 800);
  }
  </script>

  <div class="container-fluid py-4 px-4">
    {% block content %}{% endblock %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
