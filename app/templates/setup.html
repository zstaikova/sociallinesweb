{% extends "base.html" %}
{% block title %}Accounts — FamJam{% endblock %}

{% block content %}
<h4 class="mb-3">Connected Accounts</h4>


<div class="row g-3" id="platforms-grid">
  {% for p in platforms %}
  <div class="col-12 col-md-6 col-lg-4">
    <div class="card h-100 shadow-sm platform-card-overview" style="border-left: 4px solid {{ p.color }};">
      <div class="card-body p-3">

        <!-- Header (always visible, click to expand/collapse) -->
        <div class="d-flex align-items-center gap-2 platform-card-header"
             onclick="togglePlatformCard('{{ p.id }}')" style="cursor:pointer;user-select:none;">
          <div class="d-flex align-items-center justify-content-center rounded-circle flex-shrink-0"
               style="width:36px;height:36px;background:{{ p.color }}20;">
            <i class="bi {{ p.icon }}" style="color:{{ p.color }};"></i>
          </div>
          <span class="fw-semibold flex-grow-1">{{ p.name }}</span>
          <span id="pstatus-{{ p.id }}" class="badge border" style="font-size:.6rem;"></span>
          <i class="bi bi-chevron-down" id="pchevron-{{ p.id }}"
             style="font-size:.75rem;color:#9ca3af;transition:transform .2s;flex-shrink:0;"></i>
        </div>

        <!-- Collapsible body: accounts + action button -->
        <div id="pbody-{{ p.id }}" style="display:none;margin-top:10px;">
          <!-- Accounts (loaded by JS) -->
          <div id="accts-{{ p.id }}" class="mb-2"></div>

          <!-- Actions -->
          <a href="{{ url_for('accounts_platform', platform_id=p.id) }}"
             class="btn btn-sm w-100 {% if p.configured %}btn-outline-secondary{% else %}btn-primary{% endif %}">
            {% if p.configured %}
              <i class="bi bi-plus-circle me-1"></i>Add / Manage
            {% else %}
              <i class="bi bi-box-arrow-in-right me-1"></i>Connect
            {% endif %}
          </a>
        </div>

      </div>
    </div>
  </div>
  {% endfor %}
</div>
{% endblock %}

{% block scripts %}
<style>
.platform-card-overview { transition: box-shadow .15s; }
.platform-card-overview:hover { box-shadow: 0 4px 16px rgba(0,0,0,.1) !important; }
.platform-card-header:hover .bi-chevron-down { color: #4361ee !important; }
</style>
<script>
const platformIds = {{ platforms | map(attribute='id') | list | tojson }};

function togglePlatformCard(pid) {
  const body    = document.getElementById('pbody-' + pid);
  const chevron = document.getElementById('pchevron-' + pid);
  const isOpen  = body.style.display !== 'none';
  body.style.display      = isOpen ? 'none' : 'block';
  chevron.style.transform = isOpen ? '' : 'rotate(180deg)';
}

async function loadAllAccounts() {
  const res  = await fetch('/api/accounts');
  const list = await res.json();

  // Group by platform
  const byPlatform = {};
  list.forEach(a => {
    if (!byPlatform[a.platform]) byPlatform[a.platform] = [];
    byPlatform[a.platform].push(a);
  });

  platformIds.forEach(pid => {
    const container   = document.getElementById('accts-' + pid);
    const statusBadge = document.getElementById('pstatus-' + pid);
    if (!container) return;
    const accounts = byPlatform[pid] || [];

    // Update status badge in header
    if (statusBadge) {
      if (accounts.length) {
        const name = accounts.find(a => a.active)?.account_name || accounts[0].account_name;
        statusBadge.textContent = name;
        statusBadge.className   = 'badge border bg-success-subtle text-success border-success-subtle';
      } else {
        statusBadge.textContent = 'Not connected';
        statusBadge.className   = 'badge border bg-secondary-subtle text-secondary border-secondary-subtle';
      }
      statusBadge.style.fontSize = '.6rem';
    }

    if (!accounts.length) {
      container.innerHTML = '<div class="text-muted small py-1">Not connected</div>';
      return;
    }

    container.innerHTML = accounts.map(a => `
      <div class="d-flex align-items-center gap-2 py-1">
        <i class="bi bi-check-circle-fill text-success" style="font-size:.8rem;"></i>
        <span class="small flex-grow-1 text-truncate fw-medium">${a.account_name}</span>
        ${accounts.length > 1 && !a.active
          ? `<button class="btn btn-link btn-sm p-0 text-muted" style="font-size:.7rem;" onclick="setActive('${a.id}','${pid}')">activate</button>`
          : (accounts.length > 1 ? '<span class="badge bg-success-subtle text-success border border-success-subtle" style="font-size:.65rem;">active</span>' : '')}
        <button class="btn btn-outline-danger btn-sm py-0 px-1" style="font-size:.7rem;"
                onclick="logOut('${a.id}','${a.account_name.replace(/'/g,"\\'")}','${pid}')">
          Log Out
        </button>
      </div>`).join('');
  });
}

async function setActive(id, pid) {
  await fetch('/api/accounts/' + id + '/activate', {method: 'POST'});
  loadAllAccounts();
}

async function logOut(id, name, pid) {
  if (!confirm(`Log out of "${name}"?`)) return;
  await fetch('/api/accounts/' + id, {method: 'DELETE'});
  loadAllAccounts();
}

loadAllAccounts();
</script>
{% endblock %}
