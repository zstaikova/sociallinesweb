<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In — Socialline</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      background: #f0f2f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
    }
    .login-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 380px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.2rem;
      color: #1a1a2e;
      margin-bottom: 1.75rem;
      justify-content: center;
    }
    .brand i { color: #4361ee; font-size: 1.5rem; }
    label { font-size: .82rem; font-weight: 600; color: #374151; }
    .form-control {
      border-radius: 8px;
      border: 1.5px solid #e5e7eb;
      font-size: .9rem;
      padding: .55rem .85rem;
      transition: border-color .15s;
    }
    .form-control:focus { border-color: #4361ee; box-shadow: 0 0 0 3px rgba(67,97,238,.1); }
    .btn-login {
      width: 100%;
      background: #4361ee;
      color: #fff;
      border: none;
      border-radius: 9px;
      padding: .65rem;
      font-weight: 600;
      font-size: .95rem;
      cursor: pointer;
      transition: background .15s;
      margin-top: .25rem;
    }
    .btn-login:hover { background: #3451d1; }
    .alert-error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #b91c1c;
      border-radius: 8px;
      padding: .6rem .85rem;
      font-size: .85rem;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="brand">
      <i class="bi bi-camera-reels"></i>
      <span>Socialline</span>
    </div>

    {% if error %}
    <div class="alert-error">
      <i class="bi bi-exclamation-circle me-1"></i>{{ error }}
    </div>
    {% endif %}

    <form method="post" action="/login">
      <input type="hidden" name="next" value="{{ next }}">
      <div class="mb-3">
        <label for="username" class="form-label mb-1">Username</label>
        <input type="text" id="username" name="username" class="form-control"
               placeholder="admin" autocomplete="username" autofocus required>
      </div>
      <div class="mb-4">
        <label for="password" class="form-label mb-1">Password</label>
        <div class="position-relative">
          <input type="password" id="password" name="password" class="form-control"
                 placeholder="••••••••" autocomplete="current-password" required>
          <button type="button" class="btn btn-sm position-absolute end-0 top-50 translate-middle-y me-1 text-secondary border-0 bg-transparent"
                  onclick="togglePw()" tabindex="-1" title="Show/hide">
            <i class="bi bi-eye" id="pw-eye"></i>
          </button>
        </div>
      </div>
      <button type="submit" class="btn-login">Sign in</button>
    </form>
  </div>

  <script>
  function togglePw() {
    const inp = document.getElementById('password');
    const ico = document.getElementById('pw-eye');
    if (inp.type === 'password') {
      inp.type = 'text';
      ico.className = 'bi bi-eye-slash';
    } else {
      inp.type = 'password';
      ico.className = 'bi bi-eye';
    }
  }
  </script>
</body>
</html>
